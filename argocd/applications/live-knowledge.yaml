apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: live-knowledge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aakashRepoCodes/event-driven-service-architecture.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: live-knowledge
