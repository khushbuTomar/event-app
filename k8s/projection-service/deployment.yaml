apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-service
  namespace: live-knowledge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: projection-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projection-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-credentials
      containers:
        - name: projection-service
          image: ghcr.io/aakashrepocodes/event-driven-service-architecture/projection-service@sha256:e9b0da69909040e71f88cdb472f6c1af66d3dff9aab75afa4ffe93191985e002
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: projection-service-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: projection-postgres-credentials
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
