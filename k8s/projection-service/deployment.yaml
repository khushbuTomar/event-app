apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-service
  namespace: live-knowledge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: projection-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projection-service
    spec:
      containers:
        - name: projection-service
          image: ghcr.io/khushbutomar/event-app/projection-service@sha256:3007ecc22740c0a58e3aebb07ca619ccf4fc2485f0cbd3059db1f4cf0979cba2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: projection-service-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: projection-postgres-credentials
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
