spring.config.activate.on-profile=kafka

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:projection-service}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=manual_immediate

kafka.topic=${KAFKA_TOPIC:wiki-change}

logging.level.org.apache.kafka=WARN
logging.level.com.klick.projectionservice=INFO
